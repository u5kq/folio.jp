<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f1">
<title>folio ID — 共通アカウント</title>
<style>
:root{color-scheme:light;--ink:#20231d;--muted:#777d70;--line:#e5e7df;--paper:#fff;--bg:#f5f6f1;--accent:#758665}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#e9ede3 0,transparent 42%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;display:grid;place-items:center;padding:28px 16px}
.wrap{width:min(100%,440px)}.brand{display:flex;justify-content:center;align-items:center;gap:9px;font-size:23px;font-weight:750;letter-spacing:-.07em;margin-bottom:28px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#20231d;color:white;font-size:18px}.brand span:last-child span{color:#8b9a76}
.card{background:#ffffffed;border:1px solid var(--line);border-radius:24px;padding:clamp(24px,6vw,36px);box-shadow:0 22px 70px #28301d0c;backdrop-filter:blur(16px)}
.eyebrow{text-align:center;font-size:10px;letter-spacing:.2em;color:var(--muted);font-weight:750}h1{text-align:center;font-size:29px;letter-spacing:-.055em;margin:12px 0 8px}.lead{text-align:center;color:var(--muted);font-size:13px;line-height:1.8;margin:0 0 25px}
.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#f0f1ec;border-radius:12px;margin-bottom:22px}.tabs button{border:0;background:transparent;border-radius:9px;padding:11px;color:#777;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.tabs button[aria-selected=true]{background:white;color:var(--ink);box-shadow:0 1px 5px #0000000d}
label{display:block;font-size:12px;font-weight:700;margin:15px 0 7px}input{width:100%;height:48px;border:1px solid #dfe2d8;border-radius:11px;padding:0 13px;background:white;font:inherit;font-size:14px;outline:none}input:focus{border-color:#8b9a76;box-shadow:0 0 0 3px #8b9a761c}.submit{width:100%;height:49px;border:0;border-radius:12px;background:#20231d;color:white;font:inherit;font-weight:750;margin-top:21px;cursor:pointer}.submit:hover{background:#394032}.sub-action{display:block;text-align:center;margin:16px auto 0;border:0;background:none;color:#69745e;font:inherit;font-size:12px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.notice{margin-top:20px;padding:13px 14px;background:#f4f5f0;border-radius:12px;color:#73796b;font-size:11px;line-height:1.8}.status{min-height:20px;text-align:center;font-size:12px;color:#7b6840;margin-top:12px}.foot{text-align:center;color:#92968b;font-size:10px;line-height:1.8;margin-top:20px}.foot a{color:inherit;text-decoration:underline;text-underline-offset:3px}
@media(max-width:380px){.card{padding:22px 18px}h1{font-size:25px}}
</style>
</head>
<body>
<main class="wrap">
<a class="brand" href="index.html" style="color:inherit;text-decoration:none"><span class="brand-mark">f.</span><span>folio<span>.</span></span></a>
<section class="card" aria-labelledby="title">
<div class="eyebrow">ONE ACCOUNT FOR FOLIO</div>
<h1 id="title">folio ID</h1>
<p class="lead">ひとつのアカウントで、folioのプロダクトへ。</p>
<div class="tabs" role="tablist" aria-label="アカウント操作">
<button type="button" id="loginTab" role="tab" aria-selected="true">ログイン</button>
<button type="button" id="signupTab" role="tab" aria-selected="false">新規登録</button>
</div>
<form id="accountForm">
<label for="email">メールアドレス</label>
<input id="email" type="email" autocomplete="email" placeholder="name@example.com" required>
<label for="password">パスワード</label>
<input id="password" type="password" autocomplete="current-password" placeholder="パスワード" required>
<button class="submit" type="submit" id="submitButton">ログイン</button>
</form>
<button class="sub-action" type="button" id="forgot">パスワードをお忘れの場合</button>
<div class="status" id="status" role="status" aria-live="polite"></div>
<div class="notice">このページは共通ログインの画面デザイン確認用です。認証機能はまだ接続されていません。入力内容は送信・保存されません。実際のアカウント登録やログインはできません。</div>
</section>
<div class="foot">© 2026 folio. · <a href="policy.html">利用ポリシー</a><br>folio ID / 共通アカウント UI preview</div>
</main>
<script>
const loginTab=document.getElementById('loginTab'),signupTab=document.getElementById('signupTab'),submitButton=document.getElementById('submitButton'),password=document.getElementById('password'),forgot=document.getElementById('forgot'),status=document.getElementById('status');
let mode='login';
function setMode(next){mode=next;loginTab.setAttribute('aria-selected',String(mode==='login'));signupTab.setAttribute('aria-selected',String(mode==='signup'));submitButton.textContent=mode==='login'?'ログイン':'アカウントを作成';password.autocomplete=mode==='login'?'current-password':'new-password';forgot.hidden=mode!=='login';status.textContent='';}
loginTab.addEventListener('click',()=>setMode('login'));signupTab.addEventListener('click',()=>setMode('signup'));
document.getElementById('accountForm').addEventListener('submit',e=>{e.preventDefault();status.textContent='認証機能は準備中です。入力内容は送信されていません。';});
forgot.addEventListener('click',()=>{status.textContent='パスワード再設定機能は準備中です。';});
</script>
</body>
</html>
